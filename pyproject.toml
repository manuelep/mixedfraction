[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mixedfraction"
version = "0.1.0"
description = "A pedagogical mixed-fraction library built on top of fractions.Fraction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = ["fraction", "mixed fraction", "rational numbers", "education", "pedagogical"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build",
]

[project.urls]
Homepage = "https://example.com/mixedfraction"
Repository = "https://example.com/mixedfraction"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mixedfraction = ["py.typed"]
